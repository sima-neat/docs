<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
<title>Modalix DevKit 12-pin header: pin 1 at the left end, PWR button past pin 12</title>
<rect x="30" y="70" width="640" height="60" rx="6" fill="#2b2f33" stroke="#5b6670" stroke-width="1.5"/>
<text x="350" y="30" text-anchor="middle" font-weight="700" fill="currentColor">12-pin header, seen from above</text>
<rect x="690" y="80" width="40" height="40" rx="6" fill="#d8dde2" stroke="#5b6670"/><circle cx="710" cy="100" r="9" fill="#5b6670"/><text x="710" y="150" text-anchor="middle" fill="currentColor">PWR</text>
<path d="M 60 52 l -8 -12 h 16 z" fill="#c62828"/><text x="60" y="62" text-anchor="middle" font-weight="700" fill="#c62828" font-size="0"></text>
<rect x="49" y="89" width="22" height="22" fill="#e8b84a" stroke="#c62828" stroke-width="3"/>
<text x="60" y="105" text-anchor="middle" font-weight="700" fill="currentColor">1</text>
<circle cx="112" cy="100" r="11" fill="#e8b84a"/>
<text x="112" y="105" text-anchor="middle" font-weight="700" fill="currentColor">2</text>
<circle cx="164" cy="100" r="11" fill="#e8b84a"/>
<text x="164" y="105" text-anchor="middle" font-weight="700" fill="currentColor">3</text>
<line x1="164" y1="111" x2="164" y2="175" stroke="#d9771e" stroke-width="5" stroke-linecap="round"/>
<text x="164" y="0" transform="translate(0 190) rotate(62 164 0)" fill="currentColor"><tspan font-weight="700">UART2_RXD</tspan><tspan x="164" dy="16" fill="currentColor" fill-opacity="0.75">UART TX</tspan></text>
<circle cx="216" cy="100" r="11" fill="#e8b84a"/>
<text x="216" y="105" text-anchor="middle" font-weight="700" fill="currentColor">4</text>
<line x1="216" y1="111" x2="216" y2="175" stroke="#c9a400" stroke-width="5" stroke-linecap="round"/>
<text x="216" y="0" transform="translate(0 190) rotate(62 216 0)" fill="currentColor"><tspan font-weight="700">UART2_TXD</tspan><tspan x="216" dy="16" fill="currentColor" fill-opacity="0.75">UART RX</tspan></text>
<circle cx="268" cy="100" r="11" fill="#e8b84a"/>
<text x="268" y="105" text-anchor="middle" font-weight="700" fill="currentColor">5</text>
<circle cx="320" cy="100" r="11" fill="#e8b84a"/>
<text x="320" y="105" text-anchor="middle" font-weight="700" fill="currentColor">6</text>
<circle cx="372" cy="100" r="11" fill="#e8b84a"/>
<text x="372" y="105" text-anchor="middle" font-weight="700" fill="currentColor">7</text>
<line x1="372" y1="111" x2="372" y2="175" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
<text x="372" y="0" transform="translate(0 190) rotate(62 372 0)" fill="currentColor"><tspan font-weight="700">GND</tspan><tspan x="372" dy="16" fill="currentColor" fill-opacity="0.75">UART GND</tspan></text>
<circle cx="424" cy="100" r="11" fill="#e8b84a"/>
<text x="424" y="105" text-anchor="middle" font-weight="700" fill="currentColor">8</text>
<circle cx="476" cy="100" r="11" fill="#e8b84a"/>
<text x="476" y="105" text-anchor="middle" font-weight="700" fill="currentColor">9</text>
<line x1="476" y1="111" x2="476" y2="175" stroke="#7a8590" stroke-width="5" stroke-linecap="round"/>
<text x="476" y="0" transform="translate(0 190) rotate(62 476 0)" fill="currentColor"><tspan font-weight="700">GND</tspan><tspan x="476" dy="16" fill="currentColor" fill-opacity="0.75">Aardvark GND</tspan></text>
<circle cx="528" cy="100" r="11" fill="#e8b84a"/>
<text x="528" y="105" text-anchor="middle" font-weight="700" fill="currentColor">10</text>
<line x1="528" y1="111" x2="528" y2="175" stroke="#7b3fa8" stroke-width="5" stroke-linecap="round"/>
<text x="528" y="0" transform="translate(0 190) rotate(62 528 0)" fill="currentColor"><tspan font-weight="700">FORCE_RECOVERY</tspan><tspan x="528" dy="16" fill="currentColor" fill-opacity="0.75">Aardvark SDA</tspan></text>
<circle cx="580" cy="100" r="11" fill="#e8b84a"/>
<text x="580" y="105" text-anchor="middle" font-weight="700" fill="currentColor">11</text>
<circle cx="632" cy="100" r="11" fill="#e8b84a"/>
<text x="632" y="105" text-anchor="middle" font-weight="700" fill="currentColor">12</text>
<text x="52" y="45" text-anchor="end" font-weight="700" fill="#c62828">Pin 1</text>
</svg>